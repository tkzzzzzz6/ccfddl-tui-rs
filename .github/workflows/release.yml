name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine version and validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            cargo_version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
            if [[ "$version" != "$cargo_version" ]]; then
              echo "Tag version '$version' does not match Cargo.toml version '$cargo_version'."
              exit 1
            fi
          else
            version="manual-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust with lint tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run all tests
        run: cargo test --all-targets

  build:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows binary
        id: package_windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $name = "ccfddl-tui-$env:VERSION-windows-$arch"
          $archive = "$name.zip"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item "target/release/ccfddl-tui.exe" "dist/$name/"
          Copy-Item "README.md" "dist/$name/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$name/" }
          Compress-Archive -Path "dist/$name/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "SHA256SUMS-windows-$arch" -Encoding utf8NoBOM
          "arch=$arch" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM

      - name: Package Unix binary
        id: package_unix
        if: matrix.platform != 'windows'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch="x86_64" ;;
            arm64|aarch64) arch="aarch64" ;;
            *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          name="ccfddl-tui-${VERSION}-${PLATFORM}-${arch}"
          mkdir -p "dist/$name"
          cp "target/release/ccfddl-tui" "dist/$name/"
          cp "README.md" "dist/$name/"
          if [[ -f LICENSE ]]; then cp LICENSE "dist/$name/"; fi
          archive="${name}.tar.gz"
          tar -czf "$archive" -C dist "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "SHA256SUMS-${PLATFORM}-${arch}"
          else
            shasum -a 256 "$archive" > "SHA256SUMS-${PLATFORM}-${arch}"
          fi
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ steps.package_windows.outputs.arch }}${{ steps.package_unix.outputs.arch }}
          path: |
            *.zip
            *.tar.gz
            SHA256SUMS-*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release with all packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release packages were found."
            exit 1
          fi
          gh release create "$TAG_NAME" \
            "${assets[@]}" \
            dist/SHA256SUMS \
            --generate-notes \
            --verify-tag \
            --title "$TAG_NAME"
